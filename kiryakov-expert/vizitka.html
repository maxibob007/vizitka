<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Владимир Кирьяков — AI-автоматизация</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  min-height: 100vh;
  background:
    radial-gradient(ellipse at 70% 0%,   #1a3a20 0%,  transparent 55%),
    radial-gradient(ellipse at 10% 90%,  #1f3510 0%,  transparent 50%),
    radial-gradient(ellipse at 50% 50%,  #0d1f0f 0%,  #040c06 100%);
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px 20px;
  overflow-x: hidden;
  position: relative;
}

/* Тонкая сетка */
.bg-grid {
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(163,224,80,.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(163,224,80,.04) 1px, transparent 1px);
  background-size: 52px 52px;
  pointer-events: none;
  z-index: 0;
  animation: grid-drift 28s linear infinite;
}
@keyframes grid-drift {
  0%   { background-position: 0 0, 0 0; }
  100% { background-position: 0 52px, 52px 0; }
}

#particles { position: fixed; inset: 0; pointer-events: none; z-index: 0; }

/* ── Карточка ── */
.card {
  position: relative;
  z-index: 1;
  max-width: 468px;
  width: 100%;
  background: linear-gradient(160deg, rgba(15,32,18,.94) 0%, rgba(8,20,10,.97) 100%);
  border-radius: 28px;
  border: 1px solid rgba(163,224,80,.18);
  padding: 52px 44px 46px;
  text-align: center;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  box-shadow:
    0 30px 70px rgba(0,0,0,.55),
    0 8px 24px rgba(0,0,0,.4),
    inset 0 1px 0 rgba(163,224,80,.1);
}

/* Мягкий акцент-штрих сверху */
.card::before {
  content: '';
  position: absolute;
  top: 0; left: 50%;
  transform: translateX(-50%);
  width: 60%;
  height: 2px;
  background: linear-gradient(90deg, transparent, #a3e050, #f0b429, #a3e050, transparent);
  border-radius: 0 0 4px 4px;
}

/* ── Аватар ── */
.avatar-wrap {
  position: relative;
  display: inline-block;
  margin-bottom: 30px;
}
.avatar {
  width: 128px;
  height: 128px;
  border-radius: 50%;
  border: 3px solid transparent;
  background:
    linear-gradient(#0d1f10, #0d1f10) padding-box,
    linear-gradient(135deg, #a3e050 0%, #f0b429 50%, #6fcf97 100%) border-box;
  overflow: hidden;
  position: relative;
  box-shadow:
    0 0 0 6px rgba(163,224,80,.08),
    0 16px 40px rgba(0,0,0,.5),
    0 4px 12px rgba(0,0,0,.4);
  animation: avatar-float 4s ease-in-out infinite;
}
@keyframes avatar-float {
  0%,100% { transform: translateY(0); }
  50%      { transform: translateY(-5px); }
}
.avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center top;
  border-radius: 50%;
  display: block;
}

/* ── Имя ── */
.name {
  font-size: clamp(27px, 7vw, 40px);
  font-weight: 900;
  letter-spacing: -.5px;
  line-height: 1.15;
  margin-bottom: 6px;
  background: linear-gradient(135deg, #f5f5f0 0%, #c8f060 40%, #f0b429 80%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  filter: drop-shadow(0 2px 8px rgba(163,224,80,.25));
}

/* Разделитель */
.divider {
  display: flex;
  align-items: center;
  gap: 10px;
  justify-content: center;
  margin: 14px auto 20px;
}
.divider::before, .divider::after {
  content: '';
  flex: 1;
  max-width: 60px;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(163,224,80,.4));
}
.divider::after {
  background: linear-gradient(90deg, rgba(163,224,80,.4), transparent);
}
.divider-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: linear-gradient(135deg, #a3e050, #f0b429);
  box-shadow: 0 0 8px rgba(163,224,80,.4);
}

/* Подзаголовок */
.subtitle {
  color: rgba(210,235,200,.62);
  font-size: 13.5px;
  line-height: 1.8;
  margin-bottom: 26px;
}

/* Теги */
.tags {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
  margin-bottom: 34px;
}
.tag {
  background: rgba(163,224,80,.07);
  border: 1px solid rgba(163,224,80,.22);
  color: #a3e050;
  padding: 5px 14px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 500;
  letter-spacing: .3px;
  transition: all .25s ease;
  cursor: default;
  user-select: none;
}
.tag:hover {
  background: rgba(163,224,80,.14);
  border-color: rgba(163,224,80,.55);
  color: #c8f060;
  transform: translateY(-2px);
  box-shadow: 0 4px 14px rgba(0,0,0,.3);
}

/* ── Соцсети ── */
.socials {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-bottom: 34px;
}
.social-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 7px;
}
.social {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 56px;
  height: 56px;
  border-radius: 16px;
  background: rgba(163,224,80,.06);
  border: 1px solid rgba(163,224,80,.2);
  color: #a3e050;
  text-decoration: none;
  transition: all .3s cubic-bezier(.34,1.56,.64,1);
  box-shadow: 0 4px 12px rgba(0,0,0,.3);
}
.social:hover {
  transform: translateY(-5px) scale(1.08);
  background: rgba(163,224,80,.12);
  border-color: rgba(163,224,80,.45);
  color: #c8f060;
  box-shadow: 0 12px 28px rgba(0,0,0,.45), 0 2px 8px rgba(163,224,80,.12);
}
.social svg { width: 26px; height: 26px; }
.social-name {
  color: rgba(180,220,160,.35);
  font-size: 10px;
  letter-spacing: .6px;
  text-transform: uppercase;
}

/* ── CTA кнопка ── */
.cta {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  background: linear-gradient(135deg, #7ec820 0%, #f0b429 100%);
  color: #071008;
  text-decoration: none;
  padding: 15px 40px;
  border-radius: 50px;
  font-size: 16px;
  font-weight: 800;
  letter-spacing: .4px;
  position: relative;
  overflow: hidden;
  transition: all .28s ease;
  box-shadow:
    0 6px 22px rgba(0,0,0,.4),
    0 2px 8px rgba(126,200,32,.2);
}
.cta::before {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.25), transparent);
  transition: left .5s ease;
}
.cta:hover::before { left: 100%; }
.cta:hover {
  transform: translateY(-3px);
  box-shadow: 0 14px 36px rgba(0,0,0,.5), 0 4px 14px rgba(126,200,32,.25);
  filter: brightness(1.08);
}
.cta:active { transform: translateY(-1px); }
.cta svg, .cta span { position: relative; z-index: 1; }

/* Анимация кнопки — мягкое дыхание */
@keyframes btn-breathe {
  0%,100% { box-shadow: 0 6px 22px rgba(0,0,0,.4), 0 2px 8px rgba(126,200,32,.2); }
  50%      { box-shadow: 0 6px 28px rgba(0,0,0,.4), 0 2px 14px rgba(240,180,41,.3); }
}
.cta { animation: btn-breathe 3s ease-in-out infinite; }
.cta:hover { animation: none; }

/* Футер */
.footer {
  margin-top: 28px;
  color: rgba(163,224,80,.22);
  font-size: 11px;
  letter-spacing: .5px;
}

/* Адаптив */
@media (max-width: 480px) {
  .card { padding: 38px 20px 34px; }
  .avatar { width: 108px; height: 108px; }
  .cta { padding: 14px 28px; font-size: 15px; }
}
</style>
</head>

<script>
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');
function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);
const COLORS = ['#a3e050','#c8f060','#f0b429','#6fcf97','#7ec820'];
const pts = Array.from({ length: 55 }, () => ({
  x:  Math.random() * canvas.width,
  y:  Math.random() * canvas.height,
  r:  Math.random() * 1.6 + .3,
  dx: (Math.random() - .5) * .35,
  dy: (Math.random() - .5) * .35,
  op: Math.random() * .28 + .05,
  c:  COLORS[Math.floor(Math.random() * COLORS.length)]
}));
function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  pts.forEach(p => {
    p.x += p.dx; p.y += p.dy;
    if (p.x < 0 || p.x > canvas.width)  p.dx *= -1;
    if (p.y < 0 || p.y > canvas.height) p.dy *= -1;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = p.c;
    ctx.globalAlpha = p.op;
    ctx.fill();
  });
  ctx.globalAlpha = 1;
  requestAnimationFrame(draw);
}
draw();
setInterval(() => pts.forEach(p => {
  p.op += (Math.random() - .5) * .04;
  p.op = Math.max(.04, Math.min(.32, p.op));
}), 150);
</script>
